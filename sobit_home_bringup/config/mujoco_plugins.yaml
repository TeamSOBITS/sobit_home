# mujoco_ros2_control 0.1.2 plugins read their sensor settings here (mujoco_plugins.<label>.<sensor>.*),
# not from the URDF <sensor> blocks. robot.launch.py prefixes the topics with /<robot_name>/.
/**:
  ros__parameters:
    mujoco_plugins:
      cameras:
        type: "mujoco_ros2_control_plugins/CameraPlugin"
        camera_publish_rate: 30.0
        head_camera:
          frame_name: head_camera_color_optical_frame
          info_topic: head_camera/color/camera_info
          image_topic: head_camera/color/image_raw
          depth_topic: head_camera/depth/image_raw
        hand_left_camera:
          frame_name: hand_left_camera_optical_frame
          info_topic: hand_left_camera/color/camera_info
          image_topic: hand_left_camera/color/image_raw
          depth_topic: hand_left_camera/depth/image_raw
        hand_right_camera:
          frame_name: hand_right_camera_optical_frame
          info_topic: hand_right_camera/color/camera_info
          image_topic: hand_right_camera/color/image_raw
          depth_topic: hand_right_camera/depth/image_raw
      # Ray-cast from the MJCF site <lidar> at publish rate (sobits_mujoco_plugins); 0.25 deg like the UST-10LX
      lidars:
        type: "sobits_mujoco_plugins/RayLidarPlugin"
        publish_rate: 10.0
        lidars: [lidar_front, lidar_back]
        lidar_front:
          frame_name: lidar_front_laser
          min_angle: -2.25
          max_angle: 2.25
          angle_increment: 0.00436332
          range_min: 0.02
          range_max: 30.0
          ray_start: 0.03
          topic: lidar_front/scan
        lidar_back:
          frame_name: lidar_back_laser
          min_angle: -2.25
          max_angle: 2.25
          angle_increment: 0.00436332
          range_min: 0.02
          range_max: 30.0
          ray_start: 0.03
          topic: lidar_back/scan
