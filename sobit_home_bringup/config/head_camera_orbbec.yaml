serial_number: ""
usb_port: ""
device_num: 1

depth_registration: false
ordered_pc: true
enable_point_cloud: true
enable_colored_point_cloud: false
enable_publish_extrinsic: false
enable_frame_sync: true
publish_tf: false
log_level: none

enable_color: true
color_width: 640
color_height: 480
color_fps: 30
color_format: MJPG

enable_depth: true
depth_width: 640
depth_height: 480
depth_fps: 30
depth_format: Y16

enable_left_ir: false
enable_right_ir: false

point_cloud_qos: SENSOR_DATA  # SENSOR_DATA or DEFAULT
color_qos: SENSOR_DATA    # SENSOR_DATA or DEFAULT
depth_qos: SENSOR_DATA    # SENSOR_DATA or DEFAULT

align_mode: HW # HW/SW
connection_delay: 100
time_domain: "device"  # stamp source: device clock, kept on host time by enable_sync_host_time ("global" = SDK-fitted offset)
enable_sync_host_time: true  # hard-sync device clock to host at connect + every 30s
enable_soft_filter: true
enable_noise_removal_filter: true
