/ros2_laser_scan_merger:
  ros__parameters:
    flip1: false
    flip2: false
    inverse1: true
    inverse2: true
    laser1Alpha: 45.0
    laser1AngleMax: 0.0
    laser1AngleMin: 0.0
    laser1B: 0
    laser1G: 255
    laser1R: 0
    laser1XOff: 0.285 # TODO
    laser1YOff: 0.285 # TODO
    laser1ZOff: 0.185 # TODO
    laser2Alpha: -135.0
    laser2AngleMax: 0.0
    laser2AngleMin: 0.0
    laser2B: 0
    laser2G: 255
    laser2R: 0
    laser2XOff: -0.285 # TODO
    laser2YOff: -0.285 # TODO
    laser2ZOff: 0.185  # TODO
    pointCloudTopic: /sobit_home/lidar_scan/points # TODO: dynamic namespase
    pointCloutFrameId: sobit_home/base_footprint   # TODO: dynamic namespase
    qos_overrides./parameter_events.publisher.depth: 1000
    # qos_overrides./parameter_events.publisher.durability: volatile
    # qos_overrides./parameter_events.publisher.history: keep_last
    qos_overrides./parameter_events.publisher.reliability: best_effort
    scanTopic1: /sobit_home/lidar_front/scan # TODO: dynamic namespase
    scanTopic2: /sobit_home/lidar_back/scan  # TODO: dynamic namespase
    show1: true
    show2: true
    use_sim_time: false

/pointcloud_to_laserscan:
  ros__parameters:
    angle_increment: 0.0087 # TODO
    angle_max: 3.14
    angle_min: -3.14
    inf_epsilon: 1.0
    max_height: 1.0
    min_height: 0.0
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 10
          # durability: volatile
          # history: keep_last
          reliability: best_effort
    queue_size: 1
    range_max: 10.0
    range_min: 0.35
    scan_time: 0.3333
    target_frame: sobit_home/base_footprint # TODO: dynamic namespase
    transform_tolerance: 0.01
    use_inf: true
    use_sim_time: false