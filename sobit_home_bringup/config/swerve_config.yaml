/**/swerve_controller:
  ros__parameters:

    robot_base_frame: sobit_home/base_footprint

    twist_topic: /sobit_home/cmd_vel

    position_controller_name: "sobit_home/wheel_steer_position_controller"
    velocity_controller_name: "sobit_home/wheel_drive_velocity_controller"

    cycle_fequency: 50

    steering_joints:
      - wheel_steer_f_l_joint
      - wheel_steer_f_r_joint
      - wheel_steer_b_l_joint
      - wheel_steer_b_r_joint

    drive_joints:
      - wheel_drive_f_l_joint
      - wheel_drive_f_r_joint
      - wheel_drive_b_l_joint
      - wheel_drive_b_r_joint
