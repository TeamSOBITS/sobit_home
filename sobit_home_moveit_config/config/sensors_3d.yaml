sensors:
  - head_camera_pointcloud
  # - head_camera_depth

head_camera_pointcloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: head_camera/depth/points
  max_range: 4.0
  point_subsample: 3
  padding_offset: 0.1
  padding_scale: 1.0
  max_update_rate: 5.0
  filtered_cloud_topic: filtered_cloud

head_camera_depth:
  sensor_plugin: occupancy_map_monitor/DepthImageOctomapUpdater
  image_topic: head_camera/depth/image_raw
  queue_size: 5
  near_clipping_plane_distance: 0.3
  far_clipping_plane_distance: 3.0
  shadow_threshold: 0.2
  padding_scale: 4.0
  padding_offset: 0.03
  max_update_rate: 5.0
  filtered_cloud_topic: filtered_cloud
