  W403: {wirecount: 2, wirelabels: [GND, DATA]}
  W411: {category: bundle, colors: [*gnd, *v5], wirelabels: [GND, +5V]}
  W412: {wirecount: 2, wirelabels: [GND, DATA]}
  W413: {wirecount: 3, wirelabels: [GND, VDD, DATA]}
