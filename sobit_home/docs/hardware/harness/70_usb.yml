# USB: hubs and devices on the NUC. No hub has its power input connected, so all run on NUC bus power.
# Hub P2 serves the shoulder (A5), arm + head (A9) and base steering (A6) U2D2s.
# Hub P3 serves the display, right hand camera and mic.
# Hub P4 serves the speaker, left hand camera and head camera.
# Hub P5 serves the lift RS232 adapter (A2), gamepad, keyboard and monitor.
# P5 and the USB-CAN adapter (A8) share the rear Type-A ports; which takes USB3 vs USB2 is not fixed.
# The hand U2D2 (A10) has the second front port to itself.

cables:
  W700: {type: P2 hub attached lead, wirecount: 1, wirelabels: [USB]}
  W701: {type: USB-C to USB-A cable, wirecount: 1, wirelabels: [USB]}
  W702: {type: USB-C to USB-A cable, wirecount: 1, wirelabels: [USB]}
  W703: {type: USB-C to USB-A cable, wirecount: 1, wirelabels: [USB]}
  W710: {type: P3 hub attached lead, wirecount: 1, wirelabels: [USB]}
  W711: {type: USB-C to USB-A cable, wirecount: 1, wirelabels: [USB]}
  W712: {type: USB-A extension cable, wirecount: 1, wirelabels: [USB]}
  W713: {type: USB-C to USB-C cable, wirecount: 1, wirelabels: [USB]}
  W720: {type: P4 hub attached lead, wirecount: 1, wirelabels: [USB]}
  W721: {type: USB-C to USB-A cable, wirecount: 1, wirelabels: [USB]}
  W722: {type: USB-A extension cable, wirecount: 1, wirelabels: [USB]}
  W723: {type: USB-C to USB-C cable, wirecount: 1, wirelabels: [USB]}
  W730: {type: P5 hub attached lead, wirecount: 1, wirelabels: [USB]}
  W731: {type: UIC321H attached lead, length: 1, wirecount: 1, wirelabels: [USB]}
  W732: {type: Micro-USB to USB-A cable, wirecount: 1, wirelabels: [USB]}
  W733: {type: keyboard attached lead, wirecount: 1, wirelabels: [USB]}
  W734: {type: USB-C to USB-A cable, wirecount: 1, wirelabels: [USB]}
  W740: {type: USB-B to USB-A cable, wirecount: 1, wirelabels: [USB]}
  W741: {type: USB-C to USB-A cable, wirecount: 1, wirelabels: [USB]}

