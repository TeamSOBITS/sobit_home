/**/swerve_steering_controller:
  ros__parameters:
    robot_base_frame: base_footprint
    cmd_vel_topic: cmd_vel
    enable_tf_prefix: false
    cycle_frequency: 50.0
    driving_status_threshold: 0.26  # [rad] steer settle tolerance before drives engage
    steering_joints:
      - wheel_steer_f_l_joint
      - wheel_steer_f_r_joint
      - wheel_steer_b_l_joint
      - wheel_steer_b_r_joint
    drive_joints:
      - wheel_drive_f_l_joint
      - wheel_drive_f_r_joint
      - wheel_drive_b_l_joint
      - wheel_drive_b_r_joint
    mobile_base:
      wheel_radius: 0.075  # [m]
      wheel_x_distance: 0.35355339  # [m]
      wheel_y_distance: 0.35355339  # [m]
      steer_max_vel: 10.0  # [rad/s]
      drive_max_vel: 10.0  # IK velocity-normalization cap, m/s at wheel contact
      drive_max_acc: 1.0  # [rad/s^2] drive command slew-rate limit
