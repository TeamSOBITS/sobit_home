/**/controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    head_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_left_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_right_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    hand_left_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    hand_right_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    body_position_controller: #JOGモード
      type: joint_trajectory_controller/JointTrajectoryController
    
    # body_position_controller: #PTPモード
    #   type: position_controllers/JointGroupPositionController

    swerve_steering_controller:
      type: swerve_steering_controller_cpp/SwerveSteeringController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


/**/head_position_controller:
  ros__parameters:
    joints:
      - head_pan_joint
      - head_tilt_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true

